version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verify-learn-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - APP_ENV=${APP_ENV:-development}
      - ALLOW_MOCK_LOGIN=${ALLOW_MOCK_LOGIN:-true}
      - AI_SERVICE_URL=http://python_ai:8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/verify_learn
      - RPC_URL=${RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      - SYSTEM_PRIVATE_KEY=${SYSTEM_PRIVATE_KEY:-}
      - SBT_CONTRACT_ADDRESS=${SBT_CONTRACT_ADDRESS:-}
      - BLOCKCHAIN_MODE=${BLOCKCHAIN_MODE:-}
      - EXPLORER_URL=${EXPLORER_URL:-https://sepolia.etherscan.io}
    depends_on:
      postgres:
        condition: service_healthy
      python_ai:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./python_ai:/app/python_ai:ro
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: verify-learn-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=verify_learn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verify_learn"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  python_ai:
    build:
      context: ./python_ai
      dockerfile: Dockerfile
    container_name: verify-learn-python-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./python_ai:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

volumes:
  postgres_data:


